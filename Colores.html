<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Tabla de Colores - Brisa Ucan</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            background-color: white;
        }

        h1 {
            color: #000;
            text-align: left;
            border-bottom: 2px solid #000;
            padding-bottom: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #000;
            padding: 12px;
            text-align: left;
            font-size: 1.1em;
        }

        th {
            background-color: #f2f2f2;
        }

        /* Tamaño del cuadro de muestra */
        .muestra {
            width: 60px;
            height: 40px;
            border: 1px solid #000;
            display: block;
            margin: 0 auto;
        }

        .codigo {
            font-family: "Courier New", monospace;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Tabla de Colores HTML</h1>

    <table>
        <thead>
            <tr>
                <th>Muestra de Color</th>
                <th>Código Hexadecimal</th>
                <th>Nombre del Color</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><div class="muestra" style="background-color: #00FFFF;"></div></td>
                <td class="codigo">#00FFFF</td>
                <td>Cyan</td>
            </tr>
            <tr>
                <td><div class="muestra" style="background-color: #0000FF;"></div></td>
                <td class="codigo">#0000FF</td>
                <td>Blue</td>
            </tr>
            <tr>
                <td><div class="muestra" style="background-color: #00FF00;"></div></td>
                <td class="codigo">#00FF00</td>
                <td>Lime</td>
            </tr>
            <tr>
                <td><div class="muestra" style="background-color: #FF00FF;"></div></td>
                <td class="codigo">#FF00FF</td>
                <td>Magenta</td>
            </tr>
            <tr>
                <td><div class="muestra" style="background-color: #FF0000;"></div></td>
                <td class="codigo">#FF0000</td>
                <td>Red</td>
            </tr>
            <tr>
                <td><div class="muestra" style="background-color: #FFFF00;"></div></td>
                <td class="codigo">#FFFF00</td>
                <td>Yellow</td>
            </tr>
            <tr>
                <td><div class="muestra" style="background-color: #000000;"></div></td>
                <td class="codigo">#000000</td>
                <td>Black</td>
            </tr>
            <tr>
                <td><div class="muestra" style="background-color: #FFFFFF;"></div></td>
                <td class="codigo">#FFFFFF</td>
                <td>White</td>
            </tr>
            <tr>
                <td><div class="muestra" style="background-color: #808080;"></div></td>
                <td class="codigo">#808080</td>
                <td>Gray</td>
            </tr>
            <tr>
                <td><div class="muestra" style="background-color: #800000;"></div></td>
                <td class="codigo">#800000</td>
                <td>Maroon</td>
            </tr>
            <tr>
                <td><div class="muestra" style="background-color: #808000;"></div></td>
                <td class="codigo">#808000</td>
                <td>Olive</td>
            </tr>
            <tr>
                <td><div class="muestra" style="background-color: #008000;"></div></td>
                <td class="codigo">#008000</td>
                <td>Green</td>
            </tr>
            <tr>
                <td><div class="muestra" style="background-color: #800080;"></div></td>
                <td class="codigo">#800080</td>
                <td>Purple</td>
            </tr>
            <tr>
                <td><div class="muestra" style="background-color: #008080;"></div></td>
                <td class="codigo">#008080</td>
                <td>Teal</td>
            </tr>
            <tr>
                <td><div class="muestra" style="background-color: #000080;"></div></td>
                <td class="codigo">#000080</td>
                <td>Navy</td>
            </tr>
            <tr>
                <td><div class="muestra" style="background-color: #C0C0C0;"></div></td>
                <td class="codigo">#C0C0C0</td>
                <td>Silver</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
