<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Pantalla Rosada</title>
    <style>
        body { 
            /* Rosado Pastel vibrante */
            background-color: #F8BBD0; 
            font-family: 'Verdana', sans-serif; 
            color: #880E4F; /* Un vino/rosa oscuro para que se lea bien */
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            text-align: center;
        }

        .contenedor-central {
            background-color: rgba(255, 255, 255, 0.7); /* Cuadro blanco transparente */
            padding: 40px;
            border-radius: 20px;
            border: 5px solid #F06292; /* Borde rosa sólido */
            box-shadow: 0 8px 15px rgba(0,0,0,0.1); 
        }

        h1 { 
            font-family: 'Impact', sans-serif; 
            font-size: 3.5em; 
            margin: 0;
            color: #C2185B; 
            letter-spacing: 2px;
        }

        p {
            font-weight: bold;
            font-size: 1.2em;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="contenedor-central">
        <h1> ROSADO</h1>
    </div>

</body>
</html>
