<h1>Enfatizados y cursivas</h1>
<p><em>Enfatizar un texto</em> visualmente es ponerlo en <em>cursiva</em> o <em>itálica</em>, es decir que la fuente aparece algo inclinada. </p>
<p>Visualmente es lo mismo <i>itálica</i> que <em>enfatizado</em>, pero HTML 5 sólo da significado semántico al <em>enfatizado</em></p>
