<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Pantalla Amarilla</title>
    <style>
        body { 
            /* Amarillo más fuerte pero tipo pastel */
            background-color: #FFEB3B; 
            font-family: 'Verdana', sans-serif; 
            color: #795548; /* Un café oscuro para que contraste bien con el amarillo */
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            text-align: center;
        }

        .contenedor-central {
            background-color: rgba(255, 255, 255, 0.7); /* Cuadro blanco más sólido */
            padding: 40px;
            border-radius: 20px;
            border: 5px solid #FBC02D; /* Borde sólido para que resalte más */
            box-shadow: 0 8px 15px rgba(0,0,0,0.1); /* Un poco de sombra para que se vea pro */
        }

        h1 { 
            font-family: 'Impact', sans-serif; 
            font-size: 3.5em; 
            margin: 0;
            color: #F57F17; /* Naranja quemado para el título */
            letter-spacing: 2px;
        }

        p {
            font-weight: bold;
            font-size: 1.2em;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="contenedor-central">
        <h1> AMARILLO</h1>
        
    </div>

</body>
</html>
