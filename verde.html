<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Pantalla Verde</title>
    <style>
        body { 
            /* Un verde esmeralda suave (Pastel) */
            background-color: #A5D6A7; 
            /* Fuente Verdana para que combine con tu menú */
            font-family: 'Verdana', sans-serif; 
            color: #1B5E20; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            text-align: center;
        }

        .contenedor-central {
            background-color: rgba(255, 255, 255, 0.4); /* Cuadro blanquito transparente */
            padding: 40px;
            border-radius: 20px;
            border: 4px dashed #2E7D32;
        }

        h1 { 
            font-family: 'Impact', sans-serif; 
            font-size: 3em; 
            margin: 0;
            letter-spacing: 3px;
        }

        p {
            font-weight: bold;
            font-size: 1.2em;
        }
    </style>
</head>
<body>

    <div class="contenedor-central">
        <h1> VERDE</h1>
        
    </div>

</body>
</html>
