<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Pantalla Roja</title>
    <style>
        body { 
            /* Rojo Sandía Pastel (suave pero vibrante) */
            background-color: #EF5350; 
            font-family: 'Verdana', sans-serif; 
            color: #B71C1C; /* Rojo oscuro para que contraste bien */
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            text-align: center;
        }

        .contenedor-central {
            background-color: rgba(255, 255, 255, 0.7); /* Cuadro blanco transparente */
            padding: 40px;
            border-radius: 20px;
            border: 5px solid #D32F2F; /* Borde rojo sólido */
            box-shadow: 0 8px 15px rgba(0,0,0,0.1); 
        }

        h1 { 
            font-family: 'Impact', sans-serif; 
            font-size: 3.5em; 
            margin: 0;
            color: #C62828; 
            letter-spacing: 2px;
        }

        p {
            font-weight: bold;
            font-size: 1.2em;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="contenedor-central">
        <h1>ROJO</h1>
       
    </div>

</body>
</html>
