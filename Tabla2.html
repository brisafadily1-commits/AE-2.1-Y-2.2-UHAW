<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Horario de Clases</title>
    <style>
        body {
            /* OPCIÓN A: Fondo de imagen (Pinterest) */
            background-image: url("fondotabla.jpg"); 
            background-size: cover;
            background-attachment: fixed;
            background-position: center;

            /* OPCIÓN B: Fondo de color (si no usas imagen, borra lo de arriba) */
            /* background-color: #f0f8ff; */
            
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #1a237e; /* Un azul profundo para el título */
            text-shadow: 2px 2px 4px rgba(255,255,255,0.8);
            margin-bottom: 20px;
        }

        table {
            border-collapse: collapse;
            width: 90%;
            max-width: 800px;
            background-color: rgba(255, 255, 255, 0.9); /* Blanco con transparencia */
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.2);
        }

        th {
            background-color: #3f51b5; /* Azul para el encabezado */
            color: white;
            padding: 15px;
            text-transform: uppercase;
        }

        td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #ddd;
            color: #333;
        }

        /* Efecto al pasar el mouse por las filas */
        tr:hover {
            background-color: rgba(63, 81, 181, 0.1);
        }
    </style>
</head>
<body>

    <h1>TABLA DE HORARIO DE CLASES</h1>

    <table>
        <thead>
            <tr>
                <th>Lunes</th>
                <th>Martes</th>
                <th>Miércoles</th>
                <th>Jueves</th>
                <th>Viernes</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Matemática</td>
                <td>Ciencias</td>
                <td>Matemática</td>
                <td>Sociales</td>
                <td>Arte</td>
            </tr>
            <tr>
                <td>Inglés</td>
                <td>Comunicación</td>
                <td>Biología</td>
                <td>Historia</td>
                <td>Física</td>
            </tr>
            <tr>
                <td>Computación</td>
                <td>Historia</td>
                <td>Economía</td>
                <td>Química</td>
                <td>Redacción</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
