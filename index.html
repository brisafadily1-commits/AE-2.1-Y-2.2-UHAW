<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UHAW - Brisa - 404</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600&family=Playfair+Display:ital,wght@0,900;1,900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        :root {
            /* 1. PEGA AQUÍ EL LINK DE TU FOTO DE ARIANA GRANDE */
            --foto-ariana: url('ar fondo.jpg');

            /* COLORES PASTEL */
            --fondo-rosa-pastel: #ffebf2; /* Rosa muy suave para el fondo */
            --rosa-fuerte: #ffb1d1;
            --lila-soft: #e9e2f6;
            --texto: #5d4d5d;
        }

        body { 
            background-color: var(--fondo-rosa-pastel);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            margin: 0;
            color: var(--texto);
        }

        /* Menú Rosa Pastel */
        .navbar-custom { 
            background-color: var(--rosa-fuerte); 
            padding: 15px; 
            display: flex;
            justify-content: center;
            gap: 10px;
            border-bottom: 3px solid white;
        }

        .nav-link-custom { 
            background-color: white; 
            color: var(--texto) !important; 
            padding: 8px 18px; 
            border-radius: 50px; 
            text-decoration: none; 
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .nav-link-custom.active { background-color: var(--lila-soft); }

        /* CONTENEDOR DE DOS CUADROS */
        .main-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin-top: 10vh;
            flex-wrap: wrap; /* Para que en celular se pongan uno abajo del otro */
        }

        /* Cuadro de Texto (Izquierda) */
        .welcome-box {
            background-color: white;
            padding: 50px;
            border-radius: 40px;
            border: 3px solid var(--lila-soft);
            box-shadow: 10px 10px 0px var(--rosa-fuerte);
            max-width: 500px;
            text-align: center;
        }

        /* Cuadro de Imagen (Derecha) */
        .image-box {
            width: 350px;
            height: 450px;
            background-image: var(--foto-ariana);
            background-size: cover;
            background-position: center;
            border-radius: 40px;
            border: 8px solid white;
            box-shadow: 10px 10px 0px var(--lila-soft);
        }

        h1 { 
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            font-style: italic;
            color: #d85a8d;
            margin: 0;
        }

        h2 { 
            letter-spacing: 5px;
            text-transform: uppercase;
            font-size: 1.5rem;
            color: #7a5ba0;
        }

        .info {
            margin-top: 20px;
            font-size: 0.9rem;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <nav class="navbar-custom">
        <a class="nav-link-custom active" href="index.html">Inicio</a>
        <a class="nav-link-custom" href="Pagina1/index.html">Pag 1</a>
        <a class="nav-link-custom" href="Pagina2/index.html">Pag 2</a>
        <a class="nav-link-custom" href="Pagina3/index.html">Pag 3</a>
        <a class="nav-link-custom" href="Pagina4/index.html">Pag 4</a>
        <a class="nav-link-custom" href="Pagina5/index.html">Host Local</a>
        <a class="nav-link-custom" href="Pagina6/index.html">Estática</a>
        <a class="nav-link-custom" href="Pagina7/curriculun.pdf">CV</a>
    </nav>

    <div class="container">
        <div class="main-container">
            <div class="welcome-box">
                <h1>Bienvenidos</h1>
                <h2>Brisa</h2>
                <div class="info">
                    <p>Módulo: <strong>Herramientas Web</strong></p>
                    <p>Grupo: <strong>404</strong></p>
                    <p>Docente: <strong>Carlos Daniel Ríos Rivera</strong></p>
                </div>
            </div>

            <div class="image-box"></div>
        </div>
    </div>

</body>
</html>
