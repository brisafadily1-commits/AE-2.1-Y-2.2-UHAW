<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Index 3 - Brisa Ucan</title>
    <style>
        body {
            /* Color de fondo para toda la página */
            background-color: #E1F5FE; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 80vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .cuadro-visual {
            /* Estilo del cuadro */
            background-color: #FFEB3B; /* Fondo amarillo */
            border: 5px solid #000000; /* Borde negro grueso */
            padding: 30px;
            text-align: center;
            box-shadow: 10px 10px 0px #000000; /* Sombra sólida */
        }

        h1 {
            margin: 0 0 10px 0;
            font-family: 'Impact', sans-serif;
            letter-spacing: 2px;
        }

        p {
            font-size: 1.2em;
            margin: 0;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="cuadro-visual">
        <h1>VISUAL STUDIO CODE</h1>
        <p>Esta es una página realizada en Visual Studio Code</p>
    </div>

</body>
</html>
