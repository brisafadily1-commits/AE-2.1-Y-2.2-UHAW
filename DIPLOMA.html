<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Mi Certificado</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    
    <style>
        body {
            /* Fondo rosa pastel coincidiendo con tu página principal */
            background-color: #FAD1E8; 
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        h1 {
            /* Fuente elegante para el título */
            font-family: 'Playfair Display', serif;
            color: #1b5e20; /* Color verde oscuro */
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 0px #fff;
        }

        .contenedor-imagen {
            /* Estilo de cuadro con borde grueso */
            border: 5px solid #000; 
            border-radius: 15px;
            padding: 10px;
            background-color: white;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.1);
            max-width: 90%;
        }

        img {
            display: block;
            max-width: 100%;
            height: auto;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <h1>Mi Certificado</h1>

    <div class="contenedor-imagen">
        <img src="diploma.png" alt="Certificado Oficial">
    </div>

</body>
</html>
